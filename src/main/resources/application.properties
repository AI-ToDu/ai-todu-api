spring.application.name=AI-ToDu Platform API
spring.profiles.default=dev
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
app.cors.origins=${CORS_ORIGINS:https://ai-todu.github.io,http://localhost:4200,http://127.0.0.1:4200}
app.session.hours=8
app.outbox.delay-ms=3000
app.weather.url=https://api.open-meteo.com/v1/forecast
